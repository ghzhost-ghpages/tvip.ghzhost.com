<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVIP GHZ - IPTV Descentralizado P2P</title>
    <!-- Google Fonts Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones premium -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Layout Principal Grid */
        .app-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            width: 100vw;
            backdrop-filter: blur(10px);
            background: rgba(3, 7, 18, 0.6);
        }

        /* Sidebar Lateral (Canais) */
        .sidebar {
            background: rgba(17, 24, 39, 0.7);
            border-right: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 40px;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
        }

        .brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Barra de Busca */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            background: rgba(31, 41, 55, 0.8);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 212, 255, 0.6);
        }

        /* Lista de Filtros (Categorias) */
        .filter-container {
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            scrollbar-width: none; /* Firefox */
        }

        .filter-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #9ca3af;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: #fff;
            background: rgba(31, 41, 55, 0.8);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 102, 255, 0.2));
            border-color: #00d4ff;
            color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        /* Lista de Canais */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.2);
            border-radius: 3px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(31, 41, 55, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .channel-item:hover {
            background: rgba(31, 41, 55, 0.6);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateX(3px);
        }

        .channel-item.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 102, 255, 0.1));
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
        }

        .channel-logo {
            width: 45px;
            height: 45px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .channel-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-logo i {
            font-size: 1.5rem;
            color: rgba(0, 212, 255, 0.4);
        }

        .channel-info {
            flex: 1;
            min-width: 0;
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-group {
            font-size: 0.75rem;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .channel-flag {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: #9ca3af;
        }

        /* Área do Player (Main Content) */
        .main-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            padding: 30px;
            gap: 20px;
        }

        /* Header de Ações */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active-channel-details h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .active-channel-details p {
            font-size: 0.9rem;
            color: #00d4ff;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            padding: 10px 18px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #00d4ff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-action:hover {
            background: #00d4ff;
            color: #030712;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Container do Player de Vídeo */
        .player-wrapper {
            flex: 1;
            background: #000;
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Placeholder do Player */
        .player-placeholder {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .player-placeholder i {
            font-size: 4rem;
            color: #00d4ff;
            animation: pulse 2s ease-in-out infinite;
        }

        .player-placeholder p {
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Overlay de Estatísticas P2P */
        .p2p-stats-panel {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 15px 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card:last-child {
            border: none;
        }

        .stat-icon {
            font-size: 1.5rem;
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Outfit', sans-serif;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Loader de canais */
        .loading-ring {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
            z-index: 5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Notificação Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 35px rgba(0, 212, 255, 0.3);
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
        }

        /* Responsividade */
        @media (max-width: 992px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .sidebar {
                height: 350px;
                border-right: none;
                border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            }
            .main-content {
                padding: 15px;
            }
            .p2p-stats-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .stat-card {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                padding-bottom: 10px;
            }
            .stat-card:nth-child(3), .stat-card:nth-child(4) {
                border-bottom: none;
                padding-bottom: 0;
            }
        }

        @media (max-width: 576px) {
            .p2p-stats-panel {
                grid-template-columns: 1fr;
            }
            .stat-card {
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                padding-bottom: 10px;
            }
            .stat-card:last-child {
                border-bottom: none;
            }
            .brand h1 {
                font-size: 1.2rem;
            }
        }

        /* CORS Proxy Toggle Switch Styles */
        .cors-toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 8px;
            padding: 8px 15px;
        }

        .toggle-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #9ca3af;
            user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #9ca3af;
            transition: .3s;
        }

        input:checked + .slider {
            background-color: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background-color: #00d4ff;
            box-shadow: 0 0 8px #00d4ff;
        }

        .slider.round {
            border-radius: 20px;
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <div class="app-container">
        <!-- Sidebar de Canais -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img src="resources/logo.png" alt="TVIP GHZ Logo">
                    <h1>TVIP GHZ</h1>
                </div>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchBar" placeholder="Buscar canal...">
                </div>
            </div>

            <!-- Filtro de Categoria -->
            <div class="filter-container" id="categoryFilters">
                <div class="filter-btn active" data-category="all">Todos</div>
                <div class="filter-btn" data-category="Brasil">Brasil</div>
                <div class="filter-btn" data-category="Portugal">Portugal</div>
            </div>

            <!-- Listagem de Canais -->
            <div class="channel-list" id="channelListContainer">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </div>

        <!-- Conteúdo do Player -->
        <div class="main-content">
            <div class="main-header">
                <div class="active-channel-details">
                    <h2 id="currentChannelName">Selecione um canal</h2>
                    <p id="currentChannelInfo">Rede Descentralizada P2P WebRTC</p>
                </div>
                <div class="header-actions">
                    <div class="cors-toggle-container">
                        <label class="switch">
                            <input type="checkbox" id="corsProxyToggle">
                            <span class="slider round"></span>
                        </label>
                        <span class="toggle-label">CORS Proxy (Bypass)</span>
                    </div>
                    <a href="tvip.m3u" download class="btn-action">
                        <i class="fa-solid fa-download"></i>
                        <span>Baixar M3U</span>
                    </a>
                    <button class="btn-action" id="copyM3uBtn">
                        <i class="fa-solid fa-link"></i>
                        <span>Copiar Link</span>
                    </button>
                </div>
            </div>

            <!-- Player wrapper -->
            <div class="player-wrapper">
                <div class="loading-ring" id="videoLoader"></div>
                <div class="player-placeholder" id="playerPlaceholder">
                    <i class="fa-solid fa-tv"></i>
                    <p>Escolha um canal para sintonizar</p>
                </div>
                <video id="videoPlayer" controls autoplay></video>
            </div>

            <!-- Estatísticas P2P -->
            <div class="p2p-stats-panel">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="p2pPeers">0</span>
                        <span class="stat-label">Peers Conectados</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="p2pDownloaded">0.0 MB</span>
                        <span class="stat-label">Baixado via P2P</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="p2pUploaded">0.0 MB</span>
                        <span class="stat-label">Enviado P2P (Seed)</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-bolt"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="p2pEfficiency">0%</span>
                        <span class="stat-label">Banda Economizada</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastNotification">
        <i class="fa-solid fa-check-circle" style="color: #00d4ff;"></i>
        <span id="toastMessage">Link copiado com sucesso!</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.waves.min.js"></script>
    <!-- Hlsjs com P2P Engine CDN (CDNBye/SwarmCloud) -->
    <script src="https://cdn.jsdelivr.net/npm/cdnbye@latest/dist/hls.min.js"></script>
    <script src="js/vanta.js"></script>

    <script>
        let channelsData = [];
        let activeFilter = 'all';
        let searchQuery = '';
        let hlsInstance = null;
        let p2pStats = {
            httpDownloaded: 0,
            p2pDownloaded: 0,
            p2pUploaded: 0
        };

        const videoElement = document.getElementById('videoPlayer');
        const placeholder = document.getElementById('playerPlaceholder');
        const loader = document.getElementById('videoLoader');

        // Carregar os canais do JSON gerado
        async function fetchChannels() {
            try {
                const response = await fetch('data/channels.json');
                channelsData = await response.json();
                renderChannels();
            } catch (error) {
                console.error("Erro ao carregar canais:", error);
            }
        }

        // Renderizar os itens na sidebar
        function renderChannels() {
            const container = document.getElementById('channelListContainer');
            container.innerHTML = '';

            const filtered = channelsData.filter(channel => {
                const matchesFilter = activeFilter === 'all' || channel.country === activeFilter;
                const matchesSearch = channel.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      channel.group.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,0.4);padding:20px;">Nenhum canal ativo encontrado.</div>`;
                return;
            }

            filtered.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                
                const logoHtml = channel.logo 
                    ? `<img src="${channel.logo}" alt="${channel.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                       <i class="fa-solid fa-tv" style="display:none;"></i>`
                    : `<i class="fa-solid fa-tv"></i>`;

                item.innerHTML = `
                    <div class="channel-logo">
                        ${logoHtml}
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-group">${channel.group}</div>
                    </div>
                    <div class="channel-flag">${channel.country === 'Brasil' ? 'BR' : 'PT'}</div>
                `;

                item.addEventListener('click', () => playChannel(channel, item));
                container.appendChild(item);
            });
        }

        // Função para sintonizar/tocar um canal
        function playChannel(channel, element) {
            // Destacar o canal ativo na sidebar
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            // Esconder o placeholder
            placeholder.style.display = 'none';
            loader.style.display = 'block';

            // Atualizar títulos
            document.getElementById('currentChannelName').innerText = channel.name;
            document.getElementById('currentChannelInfo').innerText = `País: ${channel.country} | Categoria: ${channel.group}`;

            // Resetar estatísticas P2P
            resetP2PStats();

            // Destruir instância antiga do Hls se houver
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // Aplicar CORS Proxy se ativado
            const useCorsProxy = document.getElementById('corsProxyToggle').checked;
            // allorigins.win é um proxy CORS público e aberto
            const streamUrl = useCorsProxy ? `https://api.allorigins.win/raw?url=${encodeURIComponent(channel.url)}` : channel.url;

            // Iniciar P2P Engine para o stream
            const p2pConfig = {
                live: true,
                getPeersId: true,
                // Aumenta a descentralização ativando anúncios via WebRTC trackers
                announce: [
                    "wss://tracker.openwebtorrent.com",
                    "wss://tracker.novage.com.ua",
                    "wss://tracker.bj388.top"
                ],
                // No CDNBye integrado, passamos a escuta de estatísticas diretamente no callback do p2pConfig
                getStats: function (totalP2PDownloaded, totalP2PUploaded, totalHTTPDownloaded) {
                    p2pStats.httpDownloaded = totalHTTPDownloaded || 0;
                    p2pStats.p2pDownloaded = totalP2PDownloaded || 0;
                    p2pStats.p2pUploaded = totalP2PUploaded || 0;
                    updateP2PStatsUI();
                }
            };

            // HLS.js Player com P2P integrado (CDNBye)
            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    maxBufferSize: 0,
                    maxBufferLength: 30,
                    liveSyncDurationCount: 7,
                    p2pConfig: p2pConfig // Injeta a config P2P na inicialização do Hls
                });

                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoElement);

                // Escuta eventos de peers conectados
                hlsInstance.on('peers', function (peers) {
                    document.getElementById('p2pPeers').innerText = peers.length;
                });

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play();
                    loader.style.display = 'none';
                });

                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        loader.style.display = 'none';
                        console.error("Erro fatal de reprodução HLS:", data);
                    }
                });

            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Fallback para Safari / iOS nativo
                videoElement.src = streamUrl;
                videoElement.addEventListener('loadedmetadata', function() {
                    videoElement.play();
                    loader.style.display = 'none';
                });
            }
        }

        // Funções auxiliares para UI de estatísticas P2P
        function resetP2PStats() {
            p2pStats = { httpDownloaded: 0, p2pDownloaded: 0, p2pUploaded: 0 };
            document.getElementById('p2pPeers').innerText = '0';
            updateP2PStatsUI();
        }

        function updateP2PStatsUI() {
            const p2pMB = (p2pStats.p2pDownloaded / 1024).toFixed(1);
            const uploadMB = (p2pStats.p2pUploaded / 1024).toFixed(1);
            document.getElementById('p2pDownloaded').innerText = `${p2pMB} MB`;
            document.getElementById('p2pUploaded').innerText = `${uploadMB} MB`;

            const totalDownloaded = p2pStats.httpDownloaded + p2pStats.p2pDownloaded;
            if (totalDownloaded > 0) {
                const efficiency = Math.round((p2pStats.p2pDownloaded / totalDownloaded) * 100);
                document.getElementById('p2pEfficiency').innerText = `${efficiency}%`;
            } else {
                document.getElementById('p2pEfficiency').innerText = '0%';
            }
        }

        // Barra de Busca e Filtros
        document.getElementById('searchBar').addEventListener('input', function(e) {
            searchQuery = e.target.value;
            renderChannels();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.getAttribute('data-category');
                renderChannels();
            });
        });

        // Botão para copiar link M3U auto-atualizável
        document.getElementById('copyM3uBtn').addEventListener('click', function() {
            const m3uUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}tvip.m3u`;
            navigator.clipboard.writeText(m3uUrl).then(() => {
                showToast('Link da lista M3U copiado!');
            }).catch(err => {
                console.error("Falha ao copiar link:", err);
            });
        });

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Inicializar
        fetchChannels();
    </script>
</body>
</html>
