name: Daily IPTV Update 📺

on:
  schedule:
    - cron: '0 4 * * *'  # Roda todos os dias às 04:00 UTC (01:00 BRT)
  workflow_dispatch:      # Permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write         # Dá permissão para commitar no repositório

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fetch and Test IPTV Streams
      run: python scripts/update_list.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GhzHost Digital Brain"
        git config --global user.email "dono-virtual@ghzhost.com"
        git add tvip.m3u data/channels.json
        if git diff --staged --quiet; then
          echo "Nenhuma mudança nos canais ativos hoje."
        else
          git commit -m "chore: atualização diária automática de canais ativos (IPTV)"
          git push
        fi
